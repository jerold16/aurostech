<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Ribbon Main Gradient (Electric Cyan to Azure Blue) -->
    <linearGradient id="leftRibbonGrad" x1="180" y1="260" x2="300" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="25%" stopColor="#00A3FF" />
      <stop offset="70%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#1E40AF" />
    </linearGradient>

    <!-- Left Ribbon Underfold / Shadow -->
    <linearGradient id="leftUnderfoldGrad" x1="170" y1="280" x2="230" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0047AB" />
      <stop offset="50%" stopColor="#002F6C" />
      <stop offset="100%" stopColor="#001838" />
    </linearGradient>

    <!-- Right Ribbon Gradient (Royal Cobalt to Vivid Violet/Purple) -->
    <linearGradient id="rightRibbonGrad" x1="300" y1="60" x2="430" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="35%" stopColor="#3B82F6" />
      <stop offset="65%" stopColor="#7C3AED" />
      <stop offset="90%" stopColor="#9333EA" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>

    <!-- Dynamic Swoosh / Orbital Arc Gradient -->
    <linearGradient id="swooshGrad" x1="200" y1="250" x2="430" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F0FF" />
      <stop offset="40%" stopColor="#00A3FF" />
      <stop offset="75%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#6366F1" />
    </linearGradient>

    <!-- Satellite Orb Radial Gradient -->
    <radialGradient id="orbGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(425 105) rotate(45) scale(20)">
      <stop offset="0%" stopColor="#67E8F9" />
      <stop offset="30%" stopColor="#00C2FF" />
      <stop offset="70%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#0A2540" />
    </radialGradient>

    <!-- Orb Glow Filter -->
    <filter id="orbGlow" x="390" y="70" width="70" height="70" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- TECH Wordmark Gradient -->
    <linearGradient id="techWordmarkGrad" x1="365" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#007BFF" />
      <stop offset="40%" stopColor="#00C2FF" />
      <stop offset="75%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
  </defs>

  <!-- EMBLEM -->
  <g id="emblem">
    <!-- Left Ribbon Underfold (creating 3D folded ribbon depth) -->
    <path
      d="M 178 274
         C 174 278, 180 285, 195 285
         L 245 285
         L 230 255
         L 190 255
         Z"
      fill="url(#leftUnderfoldGrad)"
    />

    <!-- Left Main Ribbon Stem -->
    <path
      d="M 178 274
         C 172 265, 185 235, 218 178
         L 272 82
         C 285 58, 305 58, 318 80
         L 282 148
         L 235 240
         C 225 260, 205 275, 178 274 Z"
      fill="url(#leftRibbonGrad)"
    />

    <!-- Right Ribbon Stem (Ascending from apex down to purple right leg) -->
    <path
      d="M 312 75
         C 325 60, 345 70, 355 88
         L 415 220
         C 425 242, 428 265, 424 274
         C 418 277, 400 277, 375 277
         L 390 230
         L 348 140
         L 282 148
         L 312 75 Z"
      fill="url(#rightRibbonGrad)"
    />

    <!-- Dynamic Orbital Swoosh slicing through the right leg -->
    <path
      d="M 180 274
         C 220 260, 280 225, 335 180
         C 380 144, 412 116, 420 108
         C 412 116, 370 156, 320 196
         C 265 240, 215 268, 180 274 Z"
      fill="url(#swooshGrad)"
    />

    <!-- Swoosh Specular Edge -->
    <path
      d="M 215 260
         C 275 228, 340 180, 418 110"
      stroke="#FFFFFF"
      strokeWidth="2.5"
      strokeLinecap="round"
      opacity="0.85"
    />

    <!-- Satellite Orb at tip of trajectory -->
    <circle cx="423" cy="107" r="14" fill="url(#orbGrad)" filter="url(#orbGlow)" />
    <circle cx="420" cy="103" r="3.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
